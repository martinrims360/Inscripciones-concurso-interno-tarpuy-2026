app = "concurso-interno-tarpuy-2026"
primary_region = "gru"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  PRECIO_DELEGACION = "13"
  PRECIO_LIBRE = "10"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "off"
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
